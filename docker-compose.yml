services:
  web:
    build: .
    env_file: .env.docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # espera a que PostgreSQL esté listo
      redis:
        condition: service_started

  db:
    image: postgres:16
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data   # acá se guardan los datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata: